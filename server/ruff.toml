target-version = "py312"
line-length = 120
extend-exclude = ["migrations", ".venv"]

[lint]
# Phase 1 : uniquement les règles qui révèlent des bugs (syntaxe, noms indéfinis, imports inutilisés).
# Le tri des imports (I) et `ruff format` viendront dans une PR dédiée, pour ne pas créer
# de conflits avec les branches ouvertes.
select = ["E4", "E7", "E9", "F"]

[lint.per-file-ignores]
# Les __init__.py ré-exportent les classes de leur paquet
"__init__.py" = ["F401"]
"config/settings.py" = ["S105"]
"apps/securite/limites.py" = ["S311"]
"apps/users/infrastructure/external/GoogleAPITokenVerifier.py" = ["S105"]
"tests/**" = ["S"]

[format]
quote-style = "single"
