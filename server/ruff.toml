target-version = "py312"
line-length = 120
extend-exclude = ["migrations", ".venv"]

[lint]
# Phase 1: only the rules that reveal bugs (syntax, undefined names, unused imports).
# Import sorting (I) and `ruff format` will come in a dedicated PR, so as not to create
# conflicts with the open branches.
select = ["E4", "E7", "E9", "F"]

[lint.per-file-ignores]
# __init__.py files re-export the classes of their package
"__init__.py" = ["F401"]
"config/settings.py" = ["S105"]
"apps/securite/limites.py" = ["S311"]
"apps/users/infrastructure/external/GoogleAPITokenVerifier.py" = ["S105"]
"tests/**" = ["S"]

[format]
quote-style = "single"
