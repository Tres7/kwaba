name: Nightly

on:
  schedule:
    - cron: '0 1 * * *' # 1 h UTC (3 h à Paris en été, 2 h en hiver)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Les CVE publiées depuis la construction des images : celles du dernier manifest sont rescannées chaque nuit.
  trivy-manifest-images:
    name: Trivy (image ${{ matrix.service }} du dernier manifest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        service: [server, client]
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-manifest-tools

      - id: name
        env:
          SERVICE: ${{ matrix.service }}
        # Image du dernier manifest (absente pour le client d'un manifest v1, déployé depuis Git)
        run: echo "image=$(node .github/scripts/manifest/latest.mjs --field "services.${SERVICE}.image")" >> "$GITHUB_OUTPUT"

      - if: steps.name.outputs.image == ''
        run: echo "::notice::Pas d'image ${{ matrix.service }} dans le dernier manifest"

      - if: steps.name.outputs.image != ''
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - if: steps.name.outputs.image != ''
        run: docker pull "${{ steps.name.outputs.image }}"

      - if: steps.name.outputs.image != ''
        uses: ./.github/actions/trivy-scan
        with:
          image-ref: ${{ steps.name.outputs.image }}

  # Nouvelles CVE dans les dépendances, et secrets sur tout l'historique (toutes branches)
  security:
    name: Security
    uses: ./.github/workflows/_security-checks.yml
    with:
      back: true
      front: true
      gitleaks-log-opts: --all
