name: Config checks

on:
  workflow_call:
    inputs:
      infra:
        description: Workflows, actions, Dockerfiles, compose ou deploy/ modifiés
        type: boolean
        required: true

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint (workflows)
    if: inputs.infra
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        # Also checks the shell scripts of the workflows (shellcheck is included in the image)
        run: |
          docker run --rm -v "$PWD":/repo:ro --workdir /repo \
            rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color

  hadolint:
    name: hadolint (Dockerfiles)
    if: inputs.infra
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: server/Dockerfile
          config: .hadolint.yaml
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: client/Dockerfile
          config: .hadolint.yaml

  manifests:
    name: Manifests de déploiement (scripts et fichiers)
    if: inputs.infra
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-manifest-tools
      - name: Tests des scripts
        run: npm test --prefix .github/scripts/manifest
      - name: Manifests valides
        run: node .github/scripts/manifest/validate.mjs

  vps:
    name: Infrastructure du VPS (scripts, compose, nginx)
    if: inputs.infra
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: deploy/vps
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck
        run: shellcheck -x -P scripts scripts/*.sh
      - name: docker compose config (modèles de secrets)
        run: |
          for f in env/*.env.example; do cp "$f" "${f%.example}"; done
          SERVER_IMAGE=server CLIENT_IMAGE=client docker compose --profile tools config --quiet
      - name: nginx -t (configuration de production générée depuis le template, certificat de test)
        run: |
          certs=$(mktemp -d)
          mkdir -p "$certs/live/kwa-ba.com"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=kwa-ba.com \
            -keyout "$certs/live/kwa-ba.com/privkey.pem" -out "$certs/live/kwa-ba.com/fullchain.pem" 2> /dev/null
          image=$(grep -m1 -oE 'nginx:[^ ]+' compose.yml)
          # The image renders nginx/templates (R2_* and KWABA_* variables only) before running nginx -t, as in
          # production (compose.yml: KWABA_DOMAIN is kwa-ba.com when set nowhere)
          docker run --rm --add-host api:127.0.0.1 --add-host client:127.0.0.1 \
            -e NGINX_ENVSUBST_FILTER='^(R2_|KWABA_)' -e R2_PUBLIC_ORIGIN=https://example.com \
            -e KWABA_DOMAIN=kwa-ba.com \
            -v "$PWD/nginx/templates:/etc/nginx/templates:ro" -v "$PWD/nginx/snippets:/etc/nginx/snippets:ro" \
            -v "$certs:/etc/letsencrypt:ro" "$image" nginx -t
      - name: nginx -t (configuration du premier certificat, scripts/init-tls.sh)
        run: |
          image=$(grep -m1 -oE 'nginx:[^ ]+' compose.yml)
          # Same as the acme service of compose.yml: the bootstrap template alone, in an empty conf.d
          docker run --rm -e NGINX_ENVSUBST_FILTER='^KWABA_' -e KWABA_DOMAIN=kwa-ba.com \
            -v "$PWD/nginx/bootstrap:/etc/nginx/templates:ro" --tmpfs /etc/nginx/conf.d "$image" nginx -t

