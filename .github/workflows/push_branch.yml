name: Push branch

# Fast feedback on every work branch, PR open or not: the same checks as the pre-push hook.
# The PR then runs the full pipeline again.
on:
  push:
    branches-ignore:
      - main
      - 'dependabot/**' # their PRs already run the full pipeline

concurrency:
  group: push-branch-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server:
    name: Serveur (lint, unitaires)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DJANGO_SECRET_KEY: ci-only-secret-key-never-used-outside-github-actions-0123456789
      DJANGO_DEBUG: 'False'
      # Required outside DEBUG; unit tests do not connect to the database
      POSTGRES_PASSWORD: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python-server
      - name: Lint (ruff)
        working-directory: server
        run: ruff check . --output-format=github
      - name: Tests unitaires
        working-directory: server
        run: pytest -m unit

  client:
    name: Client (lint, types)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-client
      - uses: ./.github/actions/client-checks

  gitleaks:
    name: gitleaks (commits poussés)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: range
        # New branch (before = 000…) or push --force (before missing from the history):
        # all commits of the branch missing from main
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [[ ! "$BEFORE" =~ ^0+$ ]] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "log-opts=${BEFORE}..${GITHUB_SHA}"
          else
            echo "log-opts=origin/main..${GITHUB_SHA}"
          fi >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/gitleaks-scan
        with:
          log-opts: ${{ steps.range.outputs.log-opts }}
