name: PR main

on:
  pull_request:
    branches: [main]
    # ready_for_review: a PR leaving draft runs the full CI again
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: pr-main-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read # list of the changed files (paths-filter)

jobs:
  changes:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      back: ${{ steps.plan.outputs.back }}
      front: ${{ steps.plan.outputs.front }}
      infra: ${{ steps.plan.outputs.infra }}
      broker: ${{ steps.plan.outputs.broker }}
      docs_only: ${{ steps.plan.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: plan
        uses: ./.github/actions/detect-ci-plan

  # Level 1 (and 2 for the server: unit then integration in the same job)
  app-checks:
    name: App
    needs: changes
    if: needs.changes.outputs.back == 'true' || needs.changes.outputs.front == 'true'
    uses: ./.github/workflows/_pr-app-checks.yml
    with:
      back: ${{ needs.changes.outputs.back == 'true' }}
      front: ${{ needs.changes.outputs.front == 'true' }}
      full: ${{ !github.event.pull_request.draft }}

  # Level 1: workflows (actionlint) and Dockerfiles (hadolint)
  config-checks:
    name: Config
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    uses: ./.github/workflows/_pr-config-checks.yml
    with:
      infra: true

  # Level 2: only if level 1 did not fail (a skipped level 1 does not block)
  docker-checks:
    name: Docker
    needs: [changes, app-checks, config-checks]
    if: >-
      always() && !failure() && !cancelled()
      && !github.event.pull_request.draft
      && needs.changes.outputs.docs_only != 'true'
    uses: ./.github/workflows/_pr-docker-checks.yml
    with:
      back: ${{ needs.changes.outputs.back == 'true' }}
      front: ${{ needs.changes.outputs.front == 'true' }}
      infra: ${{ needs.changes.outputs.infra == 'true' }}

  # Level 1, on every PR: secrets in the PR's commits, audits of the changed dependencies
  security:
    name: Security
    needs: changes
    uses: ./.github/workflows/_security-checks.yml
    with:
      back: ${{ needs.changes.outputs.back == 'true' }}
      front: ${{ needs.changes.outputs.front == 'true' }}
      gitleaks-log-opts: >-
        ${{ github.event.pull_request
        && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha)
        || 'origin/main..HEAD' }}

  # Only check to require in the protection of main
  pr-status:
    name: PR status
    if: always()
    needs: [changes, app-checks, config-checks, docker-checks, security]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Résultats : $RESULTS"
          case " $RESULTS " in
            *" failure "*|*" cancelled "*) exit 1 ;;
          esac
