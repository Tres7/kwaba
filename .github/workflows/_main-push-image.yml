name: Push image

# Production image of a service (server or client): build, smoke test, Trivy, then push by digest.
on:
  workflow_call:
    inputs:
      service:
        description: server ou client (dossier du Dockerfile et nom de l'image kwaba-<service>)
        type: string
        required: true
      public-site-url:
        description: URL publique du site (client uniquement, figée dans l'image au build)
        type: string
        default: ''
      google-client-id:
        description: Identifiant OAuth Google public (client uniquement)
        type: string
        default: ''
      contact-email:
        description: Adresse de contact affichée (client uniquement)
        type: string
        default: ''
    outputs:
      image:
        description: Image publiée, référencée par digest (ghcr.io/...@sha256:...). Les tags lisibles (main, manifest-N) sont posés après le manifest.
        value: ${{ jobs.image.outputs.image }}

permissions:
  contents: read

jobs:
  image:
    name: Image ${{ inputs.service }} (build, smoke test, Trivy, push)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.push.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: name
        env:
          SERVICE: ${{ inputs.service }}
          PUBLIC_SITE_URL: ${{ inputs.public-site-url }}
        run: |
          case "$SERVICE" in server|client) ;; *) echo "::error::Service inconnu : $SERVICE"; exit 1 ;; esac
          if [ "$SERVICE" = client ] && [ -z "$PUBLIC_SITE_URL" ]; then
            echo "::error::Variable de dépôt PUBLIC_SITE_URL absente : l'URL publique doit être figée dans l'image du client"
            exit 1
          fi
          # GHCR requires a lowercase name (the repository owner is "Tres7")
          echo "repository=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/kwaba-${SERVICE}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.service }}
          target: ${{ inputs.service == 'client' && 'production' || '' }}
          push: false
          load: true
          tags: ${{ steps.name.outputs.repository }}:sha-${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ inputs.public-site-url }}
            NEXT_PUBLIC_API_URL=${{ inputs.public-site-url }}/api
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ inputs.google-client-id }}
            NEXT_PUBLIC_CONTACT_EMAIL=${{ inputs.contact-email }}
          cache-from: type=gha,scope=${{ inputs.service }}
          cache-to: type=gha,mode=max,scope=${{ inputs.service }}

      # The image is published only if it starts and the scan passes: exactly this image goes to GHCR
      - if: inputs.service == 'server'
        uses: ./.github/actions/smoke-test-image
        with:
          image: ${{ steps.name.outputs.repository }}:sha-${{ github.sha }}
      - if: inputs.service == 'client'
        uses: ./.github/actions/smoke-test-client-image
        with:
          image: ${{ steps.name.outputs.repository }}:sha-${{ github.sha }}

      - uses: ./.github/actions/trivy-scan
        with:
          image-ref: ${{ steps.name.outputs.repository }}:sha-${{ github.sha }}

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: push
        env:
          REPOSITORY: ${{ steps.name.outputs.repository }}
        run: |
          docker push "${REPOSITORY}:sha-${GITHUB_SHA}"
          image=$(docker inspect --format '{{index .RepoDigests 0}}' "${REPOSITORY}:sha-${GITHUB_SHA}")
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "Image publiée : \`${image}\`" >> "$GITHUB_STEP_SUMMARY"
