name: Security

# Shared by the PR (pr_main.yml) and the night (nightly.yml)
on:
  workflow_call:
    inputs:
      back:
        type: boolean
        required: true
      front:
        type: boolean
        required: true
      gitleaks-log-opts:
        description: Plage de commits scannée par gitleaks (« base..head » en PR, « --all » la nuit)
        type: string
        required: true

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks (secrets dans les commits)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/gitleaks-scan
        with:
          log-opts: ${{ inputs.gitleaks-log-opts }}

  npm-audit:
    name: npm audit (client)
    if: inputs.front
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: npm audit
        working-directory: client
        # Reads the lockfile, without installing. Dev dependencies do not go to production.
        run: npm audit --omit=dev --audit-level=high

  pip-audit:
    name: pip-audit (serveur)
    if: inputs.back
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: pip install "pip-audit>=2.10,<3"
      - name: pip-audit
        run: pip-audit --requirement server/requirements.txt --progress-spinner off
