name: Main

# Each deployable state of main is described by a manifest (deploy/manifests): server and client
# images, by digest, that go together. Deployments start from a manifest.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'deploy/manifests/manifest-*.yaml' # manifest commits by the CD App: no loop
      - '**/*.md'
      - 'documentation/**'
  workflow_dispatch: # run again, for example after configuring the CD App

# A single run at a time. GitHub keeps only one pending run: an intermediate run may be cancelled
# without loss, because every run compares itself with the latest manifest, not with the previous push.
concurrency:
  group: main-push
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.plan.outputs.changed }}
      build_server: ${{ steps.plan.outputs.build_server }}
      build_client: ${{ steps.plan.outputs.build_client }}
      server_revision: ${{ steps.plan.outputs.server_revision }}
      client_revision: ${{ steps.plan.outputs.client_revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-manifest-tools
      - name: Manifests existants valides
        run: node .github/scripts/manifest/validate.mjs
      - id: plan
        run: |
          node .github/scripts/manifest/plan.mjs | tee -a "$GITHUB_OUTPUT"
          {
            echo "### Plan"
            node .github/scripts/manifest/plan.mjs | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"

  server-image:
    name: Serveur
    needs: plan
    if: needs.plan.outputs.build_server == 'true'
    uses: ./.github/workflows/_main-push-image.yml
    permissions:
      contents: read
      packages: write
    with:
      service: server

  client-image:
    name: Client
    needs: plan
    if: needs.plan.outputs.build_client == 'true'
    uses: ./.github/workflows/_main-push-image.yml
    permissions:
      contents: read
      packages: write
    with:
      service: client
      # Public values baked into the browser code (repository variables, not secret)
      public-site-url: ${{ vars.PUBLIC_SITE_URL }}
      google-client-id: ${{ vars.PUBLIC_GOOGLE_CLIENT_ID }}
      contact-email: ${{ vars.PUBLIC_CONTACT_EMAIL }}

  manifest:
    name: Manifest
    needs: [plan, server-image, client-image]
    if: >-
      always() && needs.plan.outputs.changed == 'true'
      && (needs.server-image.result == 'success' || needs.server-image.result == 'skipped')
      && (needs.client-image.result == 'success' || needs.client-image.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write # final tags of the image
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-manifest-tools

      - id: create
        env:
          SERVER_REVISION: ${{ needs.plan.outputs.server_revision }}
          CLIENT_REVISION: ${{ needs.plan.outputs.client_revision }}
          SERVER_IMAGE: ${{ needs.server-image.outputs.image }}
          CLIENT_IMAGE: ${{ needs.client-image.outputs.image }}
        run: |
          node .github/scripts/manifest/create.mjs --source-revision "$GITHUB_SHA" \
            --server-revision "$SERVER_REVISION" --client-revision "$CLIENT_REVISION" \
            --server-image "$SERVER_IMAGE" --client-image "$CLIENT_IMAGE" | tee -a "$GITHUB_OUTPUT"
          file=$(grep '^file=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2)
          { echo "### Manifest \`$(basename "$file")\`"; echo '```yaml'; cat "$file"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: manifest
          path: ${{ steps.create.outputs.file }}

      - name: CD App absente
        if: vars.CD_APP_CLIENT_ID == ''
        run: |
          echo "::warning::CD App non configurée (variable CD_APP_CLIENT_ID) : manifest produit en artefact, non commité sur main."

      - id: app-token
        if: vars.CD_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.CD_APP_CLIENT_ID }}
          private-key: ${{ secrets.CD_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Commit du manifest sur main
        if: vars.CD_APP_CLIENT_ID != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          FILE: ${{ steps.create.outputs.file }}
          VERSION: ${{ steps.create.outputs.version }}
        run: |
          bot_id=$(gh api "/users/${APP_SLUG}%5Bbot%5D" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${bot_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          git add "$FILE"
          git commit -m "chore(deploy): manifest $(printf '%04d' "$VERSION") (${GITHUB_SHA::7}) [skip ci]"
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # main may have moved on (another merge): the manifest commit is replayed on top
          for attempt in 1 2 3 4 5; do
            if git push "$remote" HEAD:main; then exit 0; fi
            echo "Push refusé (tentative ${attempt}) : mise à jour depuis main"
            git pull --rebase "$remote" main
            sleep $((attempt * 2))
          done
          echo "::error::Impossible de pousser le manifest sur main"
          exit 1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags définitifs des images
        env:
          VERSION: ${{ steps.create.outputs.version }}
          COMMITTED: ${{ vars.CD_APP_CLIENT_ID != '' }}
        run: |
          for service in server client; do
            image=$(node .github/scripts/manifest/latest.mjs --field "services.${service}.image")
            repository="${image%@*}"
            tags=(--tag "${repository}:main")
            # manifest-N only for a manifest actually committed
            if [ "$COMMITTED" = "true" ]; then tags+=(--tag "${repository}:manifest-$(printf '%04d' "$VERSION")"); fi
            docker buildx imagetools create "${tags[@]}" "$image"
            echo "Tags posés sur \`${image}\` : ${tags[*]}" >> "$GITHUB_STEP_SUMMARY"
          done
