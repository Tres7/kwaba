name: Docker checks

on:
  workflow_call:
    inputs:
      back:
        type: boolean
        required: true
      front:
        type: boolean
        required: true
      infra:
        type: boolean
        required: true

permissions:
  contents: read

jobs:
  compose:
    name: Configuration compose
    if: inputs.infra
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: docker compose config
        # compose.yaml reads server/.env and client/.env, missing from the repository
        run: |
          cp server/.env.example server/.env
          cp client/.env.example client/.env
          docker compose config --quiet
          docker compose -f compose.test.yaml config --quiet

  server-image:
    name: Image du serveur (build, smoke test, Trivy)
    if: inputs.back || inputs.infra
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IMAGE: kwaba-server:pr-${{ github.event.pull_request.number || github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: server
          push: false
          load: true # image available locally for Trivy
          tags: ${{ env.IMAGE }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server
      - uses: ./.github/actions/smoke-test-image
        with:
          image: ${{ env.IMAGE }}
      - uses: ./.github/actions/trivy-scan
        with:
          image-ref: ${{ env.IMAGE }}

  client-image:
    name: Image du client (build Next.js, smoke test, Trivy)
    if: inputs.front || inputs.infra
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGE: kwaba-client:pr-${{ github.event.pull_request.number || github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: client
          target: production
          push: false
          load: true # image available locally for the smoke test and Trivy (never published from a PR)
          tags: ${{ env.IMAGE }}
          cache-from: type=gha,scope=client
          cache-to: type=gha,mode=max,scope=client
      - uses: ./.github/actions/smoke-test-client-image
        with:
          image: ${{ env.IMAGE }}
      - uses: ./.github/actions/trivy-scan
        with:
          image-ref: ${{ env.IMAGE }}
