name: Client checks
description: ESLint, vérification des types et tests (Vitest) du client.

runs:
  using: composite
  steps:
    - name: Lint (ESLint)
      shell: bash
      working-directory: client
      run: npm run lint

    - name: Types (tsc)
      shell: bash
      working-directory: client
      run: npm run typecheck

    - name: Tests (Vitest)
      shell: bash
      working-directory: client
      run: npm test
