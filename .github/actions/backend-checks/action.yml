name: Backend checks
description: >-
  ruff, migrations, check --deploy, puis pytest unit et integration sur la même machine
  pour que la couverture soit combinée. Attend PostgreSQL (service du job) et l'environnement Django.

inputs:
  run-integration:
    description: Lancer les tests d'intégration après les tests unitaires ('false' pour une PR en brouillon)
    default: 'true'
  compare-branch:
    description: Branche de référence pour la couverture du code modifié (ex. origin/main) ; vide pour l'ignorer
    default: ''

runs:
  using: composite
  steps:
    - name: Lint (ruff)
      shell: bash
      working-directory: server
      run: ruff check . --output-format=github

    - name: Migrations à jour
      shell: bash
      working-directory: server
      run: python manage.py makemigrations --check --dry-run

    - name: Réglages de production (check --deploy)
      shell: bash
      working-directory: server
      # Blocking: every security warning must be fixed or silenced with a justification (settings.py)
      run: python manage.py check --deploy --fail-level WARNING

    # --cov-fail-under=0: otherwise pytest-cov would apply the .coveragerc threshold at every step,
    # including the unit tests alone. The threshold is checked once, on the combined coverage.
    - name: Tests unitaires
      shell: bash
      working-directory: server
      run: pytest -m unit --cov --cov-report= --cov-fail-under=0

    - name: Tests d'intégration
      if: inputs.run-integration == 'true'
      shell: bash
      working-directory: server
      run: pytest -m integration --cov --cov-append --cov-report= --cov-fail-under=0

    - name: Rapport de couverture
      shell: bash
      working-directory: server
      run: |
        coverage html -d coverage-html --fail-under=0
        {
          echo "### Couverture du serveur"
          coverage report --format=markdown --skip-covered --sort=cover --fail-under=0
        } >> "$GITHUB_STEP_SUMMARY"

    # Thresholds only apply to the combined coverage: a draft PR runs the unit tests only
    - name: Cliquet de couverture globale (.coveragerc)
      if: inputs.run-integration == 'true'
      shell: bash
      working-directory: server
      run: |
        total=$(coverage report --format=total)
        echo "Couverture globale : ${total} %"

    - name: Couverture du code modifié (80 % minimum)
      if: inputs.run-integration == 'true' && inputs.compare-branch != ''
      shell: bash
      working-directory: server
      env:
        COMPARE_BRANCH: ${{ inputs.compare-branch }}
      run: |
        coverage xml -q -o coverage.xml --fail-under=0
        status=0
        diff-cover coverage.xml --compare-branch="$COMPARE_BRANCH" --fail-under=80 \
          --format markdown:diff-cover.md || status=$?
        cat diff-cover.md >> "$GITHUB_STEP_SUMMARY"
        exit "$status"
