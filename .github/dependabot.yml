version: 2

updates:
  - package-ecosystem: github-actions
    directories: ['/', '/.github/actions/*']
    target-branch: main
    schedule:
      interval: daily
      time: '03:00'
      timezone: Europe/Paris
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ['*']

  - package-ecosystem: pip
    directory: /server
    target-branch: main
    schedule:
      interval: daily
      time: '03:00'
      timezone: Europe/Paris
    cooldown:
      default-days: 7
    groups:
      python-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /client
    target-branch: main
    schedule:
      interval: daily
      time: '03:00'
      timezone: Europe/Paris
    cooldown:
      default-days: 7
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories: ['/server', '/client']
    target-branch: main
    schedule:
      interval: daily
      time: '03:00'
      timezone: Europe/Paris
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: node
        update-types: ['version-update:semver-major']
      - dependency-name: python
        update-types: ['version-update:semver-minor']

  - package-ecosystem: npm
    directory: /.github/scripts/manifest
    target-branch: main
    schedule:
      interval: daily
      time: '03:00'
      timezone: Europe/Paris
    cooldown:
      default-days: 7
    groups:
      manifest-tools:
        patterns: ['*']
