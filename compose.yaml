name: kwaba

services:
  db:
    image: postgres:16-bookworm
    container_name: kwaba-db
    env_file:
      - server/.env
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 20

  pgadmin:
    image: dpage/pgadmin4:9
    container_name: kwaba-pgadmin
    env_file:
      - server/.env
    ports:
      - "127.0.0.1:5051:80"
    depends_on:
      db:
        condition: service_healthy

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: kwaba-backend
    user: "${UID:-1000}:${GID:-1000}"
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./server:/app
    ports:
      - "8000:8000"
    env_file:
      - server/.env
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      target: dev
    container_name: kwaba-frontend
    user: node
    command: npm run dev
    volumes:
      - ./client:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    env_file:
      - client/.env
    environment:
      - INTERNAL_API_URL=http://backend:8000/api
      - WATCHPACK_POLLING=true
    depends_on:
      - backend

  rabbitmq:
    image: rabbitmq:4-management
    env_file:
      - server/.env
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  # Spelling checker of the listings (server/apps/correcteur): the backend reaches it at http://languagetool:8010
  languagetool:
    image: erikvl87/languagetool:6.8@sha256:ef8fa12cbd485166c9ceeb7139d76d56d07707a624da6bb1fc1fbb5411750527
    container_name: kwaba-languagetool
    environment:
      Java_Xms: 256m
      Java_Xmx: 512m
      # Rules of a language loaded once, not at every check (2 s → 50 ms)
      langtool_pipelineCaching: 'true'
      langtool_maxPipelinePoolSize: '4'
    ports:
      - "127.0.0.1:8010:8010"
    # Also keeps the French and English rules loaded, and their spelling suggestions (a mistake on purpose): no host
    # waits for them (about 8 s the first time)
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS -o /dev/null --data "language=fr&text=Une mason" http://localhost:8010/v2/check && curl -fsS -o /dev/null --data "language=en-GB&text=A hous" http://localhost:8010/v2/check']
      interval: 30s
      timeout: 15s
      start_period: 60s
      retries: 3

  consumer:
    build:
      context: ./server
    user: "${UID:-1000}:${GID:-1000}"
    command: python manage.py consume_events
    volumes:
      - ./server:/app
    env_file:
      - server/.env
    depends_on:
      - rabbitmq
      - db
    restart: on-failure

  messaging-relay:
    build:
      context: ./server
    user: "${UID:-1000}:${GID:-1000}"
    command: python manage.py relay_messaging_outbox
    volumes:
      - ./server:/app
    env_file:
      - server/.env
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    restart: on-failure

  paiements-worker:
    build:
      context: ./server
    command: python manage.py traiter_paiements
    volumes:
      - ./server:/app
    env_file:
      - server/.env
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

volumes:
  postgres_data:
  rabbitmq_data:
