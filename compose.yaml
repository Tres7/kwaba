# Development only. The database, pgAdmin and RabbitMQ only listen on 127.0.0.1 (invisible from the local network);
# pgAdmin and the RabbitMQ console must never be deployed in production.
name: kwaba

services:
  # ========================
  # Base de donnees
  # ========================
  db:
    image: postgres:16-bookworm
    container_name: kwaba-db
    env_file:
      - server/.env
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 20

  # ========================
  # pgAdmin
  # ========================
  pgadmin:
    image: dpage/pgadmin4:9
    container_name: kwaba-pgadmin
    env_file:
      - server/.env
    # environment:
    #   PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
    #   PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "127.0.0.1:5051:80"
    depends_on:
      db:
        condition: service_healthy

  # ========================
  # Backend Django
  # ========================
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: kwaba-backend
    # Not root: __pycache__ and mediafiles are written in the mounted folder with your uid
    user: "${UID:-1000}:${GID:-1000}"
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./server:/app
    ports:
      - "8000:8000"
    env_file:
      - server/.env
    depends_on:
      db:
        condition: service_healthy

  # ========================
  # Frontend Next.js
  # ========================
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      target: dev # the production image (default target) is used on the VPS
    container_name: kwaba-frontend
    # Not root: .next is written in the mounted folder with your uid (otherwise tsc and the pre-push hook fail)
    user: node
    command: npm run dev
    volumes:
      - ./client:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    env_file:
      - client/.env
    environment:
      - INTERNAL_API_URL=http://backend:8000/api
      # Docker Desktop (Windows/macOS) does not forward file events: polling
      - WATCHPACK_POLLING=true
    depends_on:
      - backend

  rabbitmq:
    image: rabbitmq:4-management
    env_file:
      - server/.env
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    # environment:
    #   RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
    #   RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  consumer:
    build:
      context: ./server
    user: "${UID:-1000}:${GID:-1000}"
    command: python manage.py consume_events
    volumes:
      - ./server:/app
    env_file:
      - server/.env
    depends_on:
      - rabbitmq
      - db
    restart: on-failure

  # Messaging outbox relay: publishes the due notifications (a single instance, see ADR-016)
  messaging-relay:
    build:
      context: ./server
    user: "${UID:-1000}:${GID:-1000}"
    command: python manage.py relay_messaging_outbox
    volumes:
      - ./server:/app
    env_file:
      - server/.env
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    restart: on-failure

  # Payments worker: expiry of unpaid bookings, payouts to hosts, refunds
  paiements-worker:
    build:
      context: ./server
    command: python manage.py traiter_paiements
    volumes:
      - ./server:/app
    env_file:
      - server/.env
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

volumes:
  postgres_data:
  rabbitmq_data:
