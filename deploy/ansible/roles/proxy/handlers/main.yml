# A configuration Caddy refuses makes Ansible fail here, while Caddy keeps serving with the previous one
- name: Recharger Caddy
  ansible.builtin.command: >
    docker exec {{ proxy_conteneur }}
    sh -c 'caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
    && caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile'
  changed_when: true
  when: proxy_actif | bool and proxy_demarre | bool
