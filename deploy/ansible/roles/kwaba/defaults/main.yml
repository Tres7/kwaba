# Production values: the preprod changes them in its inventory (name, folder, user, scheduled tasks)
kwaba_nom: kwaba
kwaba_racine: /opt/kwaba
# Used only by the CI/CD (docker group, no sudo); its SSH key is added separately
kwaba_utilisateur: deploy

# What makes this environment different from the production, written to env/deploy.conf and read by the VPS scripts
# (scripts/lib.sh): project name, compose files, domain, TLS mode. Empty in production: no file, the defaults apply.
kwaba_deploy_conf: {}

# Secret files of the application: name → variables, written to env/<name>.env (values from the Vault of the inventory).
# Empty in production: its files are still written by hand on the server, Ansible leaves them alone.
kwaba_env: {}

# Scheduled tasks (server time: UTC)
kwaba_sauvegarde: true
kwaba_renouvellement_certificats: true
