# live-restore (daemon.json): the containers keep running while the daemon restarts
- name: Redémarrer Docker
  ansible.builtin.systemd_service:
    name: docker
    state: restarted

- name: Recharger sysctl
  ansible.builtin.command: sysctl -q --system
  changed_when: true

- name: Redémarrer fail2ban
  ansible.builtin.systemd_service:
    name: fail2ban
    state: restarted

- name: Recharger SSH
  ansible.builtin.systemd_service:
    name: ssh
    state: reloaded
