[defaults]
# The inventory lives in the private kwa-ba-infra repository: always passed with -i
roles_path = roles
stdout_callback = default
callback_result_format = yaml
retry_files_enabled = false
interpreter_python = auto_silent

[privilege_escalation]
# sudo with a password on every server (--ask-become-pass): never a passwordless privileged key
become_ask_pass = true

[ssh_connection]
pipelining = true
