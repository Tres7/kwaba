# Kwa-Ba production on the VPS (/opt/kwaba). Deployed by the deploy workflow from a manifest:
# SERVER_IMAGE and CLIENT_IMAGE (pinned by digest) are written to .deploy.env by scripts/deploy.sh.
# Secrets live in env/*.env, on the VPS only (templates: env/*.env.example).
# Only nginx is exposed (80, 443); PostgreSQL, RabbitMQ, the API and the client stay on the internal network.
name: kwaba

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

# No process may gain privileges after start (setuid binaries, etc.)
x-security: &security
  - no-new-privileges:true

# API, consumer, relay and payments worker: same image, different command
x-server: &server
  image: ${SERVER_IMAGE:?SERVER_IMAGE manquant (.deploy.env)}
  env_file: [env/server.env, env/postgres.env, env/rabbitmq.env]
  environment:
    POSTGRES_HOST: postgres
    RABBITMQ_HOST: rabbitmq
  restart: unless-stopped
  logging: *logging
  security_opt: *security
  # backend: PostgreSQL and RabbitMQ; edge: Internet (SMTP, Google, payment providers, R2) and the client
  networks: [backend, edge]
  depends_on:
    postgres: { condition: service_healthy }
    rabbitmq: { condition: service_healthy }

services:
  nginx:
    image: nginx:1.29-alpine@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de
    ports: ['${HTTP_PORT:-80}:80', '${HTTPS_PORT:-443}:443']
    # nginx/templates/*.template are rendered into /etc/nginx/conf.d at start; only R2_* and KWABA_* variables are
    # substituted (nginx's own $variables stay as they are)
    env_file: [env/nginx.env]
    environment:
      NGINX_ENVSUBST_FILTER: '^(R2_|KWABA_)'
      # Same variable as scripts/deploy.sh and init-tls.sh (production: kwa-ba.com, set nowhere)
      KWABA_DOMAIN: ${KWABA_DOMAIN:-kwa-ba.com}
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - letsencrypt:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
      - nginx-cache:/var/cache/nginx
    security_opt: *security
    networks: [edge]
    restart: unless-stopped
    logging: *logging
    mem_limit: 128m
    depends_on: [api, client]

  api:
    <<: *server
    environment:
      POSTGRES_HOST: postgres
      RABBITMQ_HOST: rabbitmq
      WEB_CONCURRENCY: '2'
      # nginx is the only proxy in front of the API. Without this value, every visitor has the address of nginx:
      # limits per IP shared by the whole site, wrong address in the audit log. Set here and not in x-server:
      # an environment block of a service replaces the one of the anchor.
      DJANGO_NUM_PROXIES: '1'
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/', timeout=5)"]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 20s
    mem_limit: 640m

  consumer:
    <<: *server
    command: ['python', 'manage.py', 'consume_events']
    mem_limit: 256m

  relay:
    <<: *server
    command: ['python', 'manage.py', 'relay_messaging_outbox']
    mem_limit: 256m

  payments:
    <<: *server
    command: ['python', 'manage.py', 'traiter_paiements']
    mem_limit: 256m

  client:
    image: ${CLIENT_IMAGE:?CLIENT_IMAGE manquant (.deploy.env)}
    env_file: [env/client.env]
    environment:
      INTERNAL_API_URL: http://api:8000/api
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:3000/en').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 20s
    security_opt: *security
    networks: [edge]
    restart: unless-stopped
    logging: *logging
    mem_limit: 512m

  postgres:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    env_file: [env/postgres.env]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 20
    shm_size: 128m
    security_opt: *security
    networks: [backend]
    restart: unless-stopped
    logging: *logging
    mem_limit: 768m

  rabbitmq:
    image: rabbitmq:4-alpine@sha256:2cb43283d8bbd3caa6c0f0dc00e96c8de772df33df7fd8af6aee4d605aeb8ada
    env_file: [env/rabbitmq.env]
    volumes: [rabbitmq-data:/var/lib/rabbitmq]
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 10s
      retries: 10
    security_opt: *security
    networks: [backend]
    restart: unless-stopped
    logging: *logging
    mem_limit: 384m

  # First certificate only (scripts/init-tls.sh): plain-HTTP nginx for the Let's Encrypt challenge
  acme:
    image: nginx:1.29-alpine@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de
    ports: ['${HTTP_PORT:-80}:80']
    environment:
      NGINX_ENVSUBST_FILTER: '^KWABA_'
      KWABA_DOMAIN: ${KWABA_DOMAIN:-kwa-ba.com}
    volumes:
      - ./nginx/bootstrap:/etc/nginx/templates:ro
      - certbot-www:/var/www/certbot:ro
    # Empty conf.d: only the rendered bootstrap configuration is loaded, not the image's default.conf
    tmpfs: [/etc/nginx/conf.d]
    profiles: [tools]

  # One-off tool (no long-running container): obtains and renews Let's Encrypt certificates
  certbot:
    image: certbot/certbot@sha256:f70ad0adbb7e117f0fe42a63c553f28ea451edabc0148757b6efcd9735acaa20
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    profiles: [tools]

networks:
  # No Internet access: PostgreSQL and RabbitMQ are reachable only by the API and the workers
  backend:
    internal: true
  edge:

volumes:
  nginx-cache:
  postgres-data:
  rabbitmq-data:
  letsencrypt:
  certbot-www:
