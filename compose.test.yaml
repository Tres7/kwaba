# Services of the server tests, started on demand by pytest (server/tests/services.py).
# Separate project (kwaba-test): does not interfere with the development stack of compose.yaml.
name: kwaba-test

services:
  postgres-test:
    image: postgres:16
    environment:
      POSTGRES_DB: kwaba
      POSTGRES_USER: kwaba
      POSTGRES_PASSWORD: kwaba-test
    ports:
      - "127.0.0.1:55432:5432"
    # Data in memory: fast, and nothing survives the container stopping
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      # TCP: during initialisation, the temporary server only listens on the local socket, then restarts
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U kwaba -d kwaba"]
      interval: 1s
      timeout: 3s
      retries: 30
